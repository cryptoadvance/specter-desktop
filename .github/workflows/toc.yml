on:
  push:
    # The TOC generator commits back to the branch that was pushed. Merge-queue
    # branches (`gh-readonly-queue/...`) are temporary GitHub-managed refs and
    # must never be modified.
    branches-ignore:
      - "gh-readonly-queue/**"
    tags:
      - "**"
name: TOC Generator
jobs:
  generateTOC:
    name: TOC Generator
    runs-on: ubuntu-latest
    steps:
      - uses: technote-space/toc-generator@v2
        with:
          TARGET_PATHS: README.md, docs/faq.md, docs/development.md